apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: code-executor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: kavish004/code-executor-worker:v1
          resources:
            requests:
              cpu: "128m"
              memory: "64Mi"
            limits:
              cpu: "256m"
              memory: "256Mi"
          env:
            - name: ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: worker-configmap
                  key: address
